name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.3
        run: |
          set -euo pipefail
          GODOT_VERSION="4.3-stable"
          FILE="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${FILE}"
          curl -fsSL "$URL" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo mv /tmp/Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path . --run-tests 2>&1 | tee /tmp/signal-drift-tests.log
          if grep -q 'SCRIPT ERROR:' /tmp/signal-drift-tests.log; then
            echo "Godot reported a script error"
            exit 1
          fi
          grep -q 'ALL TESTS PASSED' /tmp/signal-drift-tests.log
