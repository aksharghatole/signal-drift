name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  boot-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.3
        run: |
          set -euo pipefail
          GODOT_VERSION="4.3-stable"
          FILE="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${FILE}"
          curl -fsSL "$URL" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo mv /tmp/Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Boot smoke test
        run: godot --headless --path . --quit-after 5

      - name: Run tests
        run: godot --headless --path . --script tests/run_tests.gd
